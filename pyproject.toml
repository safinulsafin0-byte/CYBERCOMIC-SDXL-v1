[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercomic"
version = "1.0.0"
description = "Terminal-native SDXL LoRA comic book art generator powered by CYBERCOMIC-SDXL-v1"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "diffusers>=0.30.0",
    "transformers",
    "accelerate",
    "peft",
    "safetensors",
    "pillow",
]

[project.scripts]
cybercomic = "cybercomic.cli:main"